<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:800px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#251c17}
body{padding:66px 78px;background:radial-gradient(circle at 8% 8%,#fff0d9,transparent 28%),linear-gradient(135deg,#fffaf5,#f6f7f8)}
.kicker{font-size:15px;font-weight:800;color:#d9650f;letter-spacing:.12em}.title{margin:10px 0 10px;font-size:51px;line-height:1.08}.sub{margin:0;color:#715f53;font-size:19px}
.stage{display:flex;gap:38px;align-items:center;margin-top:42px}.popup,.panel,.browser{background:#fff;border:1px solid #e9dfd8;box-shadow:0 24px 70px rgba(71,45,25,.12)}
.popup{width:390px;border-radius:22px;padding:20px;background:radial-gradient(circle at 100% 0,rgba(255,166,65,.14),transparent 34%),#fffaf5}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px}.brand b{font-size:23px}.brand small{display:block;color:#76665c;margin-top:3px;font-size:13px}
.h2{font-size:16px;font-weight:800;margin:21px 0 10px}.summary{font-size:13px;font-weight:700;color:#5e4a3e;margin-bottom:10px}.btn{border-radius:11px;padding:12px 14px;text-align:center;font-weight:800}.danger{background:#bd302a;color:#fff}.warning{margin:10px 2px 0;color:#826f62;font-size:12px;line-height:1.5}
.supports{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.support{height:34px;border:1px solid #eadfd6;border-radius:9px;background:rgba(255,255,255,.7);display:grid;grid-template-columns:18px 1fr 10px;gap:5px;align-items:center;padding:6px 8px}.support .ico{font-size:15px;color:#bd302a;text-align:center}.support b{font-size:11.5px;white-space:nowrap}.support .arr{color:#aa8c78;font-size:15px}
.foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #eadfd6;color:#9a877a;font-size:11px}.foot .link{color:#a8541c}
.panel{flex:1;border-radius:22px;padding:30px 34px}.panel h3{font-size:24px;margin:0 0 11px}.panel p{color:#715f53;font-size:15px;line-height:1.65;margin:0}.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.badge{padding:8px 12px;border-radius:99px;background:#fff0e2;color:#a95518;font-size:12px;font-weight:800}
.list{border:1px solid #eadfd6;border-radius:12px;overflow:hidden;background:#fff}.row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #f0e8e2;font-size:12px}.row:last-child{border:0}.source{color:#a45d2b}.idx{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#ffecd7;color:#99500f;font-size:10px;margin-right:9px}
.track{height:10px;border-radius:99px;background:#eadfd6;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ef7d21,#d84a2f)}
.note{font-size:12px;color:#89776c;line-height:1.55}.modal{background:#fffaf5;border:1px solid #eadfd6;border-radius:18px;box-shadow:0 20px 60px rgba(44,24,14,.18);padding:22px;text-align:center}.modal h3{font-size:18px;margin:7px 0 8px}.modal p{font-size:12px;color:#7b675a;line-height:1.55}.xbtn{margin-top:14px;padding:11px 14px;border-radius:11px;background:#251c17;color:#fff;font-weight:800;font-size:13px}.qr{width:160px;height:160px;margin:12px auto 0;border:1px solid #eadfd6;border-radius:14px;overflow:hidden;background:#fff}.qr img{width:100%;height:100%;object-fit:contain}
</style></head><body>
<div class="kicker">反馈与社区共创</div>
<h1 class="title">有问题、有建议，直接找到作者</h1>
<p class="sub">反馈 Bug、补充名单线索，或加入取关狗委员会一起共创。</p>
<div class="stage" style="align-items:stretch">
  <div class="popup" style="align-self:center">
    <div class="brand"><img src="../../../extension/assets/icon-128.png"><div><b>取关狗</b><small>X 中文社区取关名单 · 非取关检测</small></div></div>
    <div class="h2">社区取关名单</div>
    <div class="summary">名单内共 12 个账号 · 在线最新名单</div>
    <div class="btn danger">一键拉黑全部账号</div>
    <div class="warning">核心功能保持在上方，反馈与支持收在底部辅助入口。</div>
    <div class="supports"><div class="support"><span class="ico">◎</span><b>反馈 / 共创</b><span class="arr">›</span></div><div class="support"><span class="ico">♡</span><b>支持作者</b><span class="arr">›</span></div></div>
    <div class="foot"><span>非 X 官方产品</span><span class="link">隐私说明</span></div>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:1.12fr .88fr;gap:18px">
    <div class="modal">
      <div style="font-size:24px;color:#bd302a">◎</div>
      <h3>反馈 / 加入取关狗委员会</h3>
      <p>有 Bug、名单建议、功能想法，或者想加入委员会一起共创，都可以直接联系。</p>
      <div class="xbtn">在 X 上私信作者</div>
      <p style="margin-top:12px">反馈内容 / 想参与的方向</p>
    </div>
    <div class="modal">
      <div style="font-size:24px;color:#bd302a">♥</div>
      <h3>支持作者</h3>
      <p>如果取关狗帮到了你，可以请作者喝杯咖啡。</p>
      <div class="qr"><img src="../../../extension/assets/alipay-support.jpg"></div>
      <p style="margin-top:8px">支付宝扫一扫</p>
    </div>
  </div>
</div></body></html>
