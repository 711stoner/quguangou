name: 提交名单线索
description: 提交单方面取消关注且未说明原因的账号记录
title: "[名单线索] "
labels:
  - 名单线索
body:
  - type: markdown
    attributes:
      value: |
        感谢提交。线索不会因单方描述自动进入名单，需要经过整理和复核。

        GitHub Issue 是公开页面。请遮盖截图中的私信、邮箱、手机号、Cookie、访问令牌等无关或敏感信息。
  - type: input
    id: account
    attributes:
      label: 涉及的 X 账号
      description: 请填写完整用户主页链接或 @用户名。
      placeholder: https://x.com/example
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 发现时间
      description: 大致日期即可。
      placeholder: 2026-09-09
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 情况说明
      description: 请简要描述何时互关、何时发现对方取消关注，以及是否沟通过。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图证据
      description: 请将经过必要遮盖的截图拖入此处上传。不要公开无关人员或敏感信息。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我确认上述内容为本人真实经历，并理解提交内容将公开显示。
          required: true
        - label: 我已遮盖截图中的密码、Cookie、令牌、联系方式和无关人员信息。
          required: true
