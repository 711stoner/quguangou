<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="取关狗">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB14A"/>
      <stop offset="0.48" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#FF3D35"/>
    </linearGradient>
    <linearGradient id="head" x1="44" y1="36" x2="81" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5E8D5"/>
    </linearGradient>
    <linearGradient id="ear" x1="23" y1="36" x2="45" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6632E"/>
      <stop offset="1" stop-color="#71391F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8E321D" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- ears -->
    <path d="M43 40c-8-10-20-11-25-4-5 7-2 22 5 29 5 5 12 5 17 1 5-5 7-18 3-26Z" fill="url(#ear)"/>
    <path d="M85 40c8-10 20-11 25-4 5 7 2 22-5 29-5 5-12 5-17 1-5-5-7-18-3-26Z" fill="url(#ear)"/>
    <!-- head -->
    <path d="M35 58c0-21 12-34 29-34s29 13 29 34v12c0 20-12 31-29 31S35 90 35 70V58Z" fill="url(#head)"/>
    <path d="M53 25c4-2 8-3 11-3 5 0 10 2 14 5-4 6-9 11-15 15-5-5-8-10-10-17Z" fill="#E5A566" opacity=".78"/>
    <!-- face -->
    <ellipse cx="53" cy="58" rx="4.4" ry="5.4" fill="#171717"/>
    <ellipse cx="76" cy="58" rx="4.4" ry="5.4" fill="#171717"/>
    <circle cx="51.5" cy="56.5" r="1.1" fill="#FFF"/>
    <circle cx="74.5" cy="56.5" r="1.1" fill="#FFF"/>
    <path d="M59 68c0-3 2-5 5-5s5 2 5 5c0 3-2 5-5 5s-5-2-5-5Z" fill="#171717"/>
    <path d="M64 72v4" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <path d="M64 76c-5 0-8-2-10-5M64 76c5 0 8-2 10-5" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <path d="M59 77c1 6 9 6 10 0-3 2-7 2-10 0Z" fill="#FF765E"/>
    <!-- broken chain -->
    <path d="M21 88c-5-5-5-13 0-18l7-7c5-5 13-5 18 0l5 5" fill="none" stroke="#20242B" stroke-width="8" stroke-linecap="round"/>
    <path d="M77 68l5-5c5-5 13-5 18 0l7 7c5 5 5 13 0 18l-7 7c-5 5-13 5-18 0l-5-5" fill="none" stroke="#20242B" stroke-width="8" stroke-linecap="round"/>
    <!-- paws gripping chain -->
    <ellipse cx="43" cy="84" rx="10" ry="8" fill="#FFF7EC"/>
    <ellipse cx="84" cy="84" rx="10" ry="8" fill="#FFF7EC"/>
    <path d="M42 81v5M47 82v4M83 81v5M88 82v4" stroke="#E9D7C4" stroke-width="1.6" stroke-linecap="round"/>
    <!-- break spark -->
    <path d="M61 82l5-7M67 85l7-2" stroke="#FF4A3E" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- unfollow badge -->
  <circle cx="99" cy="98" r="20" fill="#FF4338" stroke="#FFF" stroke-width="5"/>
  <path d="M89 98h20" stroke="#FFF" stroke-width="7" stroke-linecap="round"/>
</svg>
